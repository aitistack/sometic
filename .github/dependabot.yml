version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          production-npm:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-npm:
              dependency-type: development
              update-types:
                  - minor
                  - patch
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns:
                  - "*"
