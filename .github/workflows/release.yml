name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    version:
        name: Version PR
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Create Version Pull Request
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  title: "chore: version packages"
                  commit: "chore: version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish:
        name: Publish npm
        runs-on: ubuntu-latest
        timeout-minutes: 45
        environment: npm-publish
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Enable npm trusted publishing
              run: |
                  npm install -g npm@11.5.2
                  npm -v
                  for file in "${NPM_CONFIG_USERCONFIG:-}" "${HOME}/.npmrc"; do
                      if [ -n "${file}" ] && [ -f "${file}" ]; then
                          sed -i '/_authToken/d' "${file}"
                      fi
                  done

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Validate packages
              run: pnpm packages:validate

            - name: Dependency audit
              run: pnpm audit:deps

            - name: Publish unpublished packages
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  pnpm exec changeset publish
                  git push origin --follow-tags

            - name: Generate CycloneDX SBOM
              run: node tooling/release/sbom.mjs --output sometic.cdx.json

            - name: Upload SBOM
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sometic-cyclonedx-sbom
                  path: sometic.cdx.json
