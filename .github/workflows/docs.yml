name: Docs

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build CDN mirrors for docs
              run: |
                  pnpm --filter @sometic/http --filter @sometic/query --filter @sometic/auth --filter @sometic/store --filter @sometic/theme --filter @sometic/head --filter @sometic/app-shell --filter @sometic/elements build

            - name: Build docs
              run: pnpm docs:build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: apps/docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
