name: Docs

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Setup Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build CDN mirrors for docs
              run: pnpm exec turbo run build --filter=@sometic/http... --filter=@sometic/query... --filter=@sometic/auth... --filter=@sometic/store... --filter=@sometic/theme... --filter=@sometic/head... --filter=@sometic/app-shell... --filter=@sometic/elements... --filter=@sometic/core... --filter=@sometic/events... --filter=@sometic/forms... --filter=@sometic/styling... --filter=@sometic/accessibility... --filter=@sometic/positioning... --filter=@sometic/dom...

            - name: Build docs
              run: pnpm docs:build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
