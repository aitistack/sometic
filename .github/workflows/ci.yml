name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm format:check

            - name: Lint
              run: pnpm lint
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Typecheck
              run: pnpm typecheck
              env:
                  NODE_OPTIONS: --max-old-space-size=4096

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Install Playwright Chromium
              run: pnpm exec playwright install chromium --with-deps

            - name: E2E
              run: pnpm test:e2e

            - name: Size
              run: pnpm size

            - name: Docs build
              run: pnpm docs:build

            - name: Docs check
              run: pnpm docs:check

            - name: Bundler smoke
              run: pnpm bundler:smoke

            - name: Validate packages
              run: pnpm packages:validate

            - name: Circular dependencies
              run: pnpm circular

            - name: Unused exports
              run: pnpm knip

            - name: Publish dry-run
              run: pnpm release:dry-run

            - name: Dependency audit
              run: pnpm audit:deps
