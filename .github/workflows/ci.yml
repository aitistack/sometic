name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

            - name: Install Playwright Chromium
              run: pnpm exec playwright install chromium --with-deps

            - name: E2E
              run: pnpm test:e2e

            - name: Build
              run: pnpm build

            - name: Size
              run: pnpm size

            - name: Docs build
              run: pnpm docs:build

            - name: Docs check
              run: pnpm docs:check

            - name: Bundler smoke
              run: pnpm bundler:smoke

            - name: Validate packages
              run: pnpm packages:validate

            - name: Circular dependencies
              run: pnpm circular

            - name: Unused exports
              run: pnpm knip

            - name: Publish dry-run
              run: pnpm release:dry-run

            - name: Dependency audit
              run: pnpm audit:deps
              continue-on-error: true
