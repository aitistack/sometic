name: Release prep

on:
    workflow_dispatch:

jobs:
    dry-run:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.14.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: pnpm release:dry-run
            - name: Trusted publishing note
              run: echo "OIDC trusted publishing will be enabled for npm in Phase 23; id-token permission is prepared."
