name: Release prep

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    dry-run:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
              with:
                  version: 10.14.0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Validate packages
              run: pnpm packages:validate

            - name: Pack all public packages
              run: pnpm release:dry-run

            - name: Unminified pack reproducibility
              run: pnpm release:repro-check
